[project]
name = "psych-platform-backend"
version = "1.0.0"
description = "心理测评平台后端 API (FastAPI)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "pydantic>=2.6,<3.0",
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.0",
    "python-multipart>=0.0.9,<1.0",
    "openpyxl>=3.1,<4.0",
    "python-docx>=1.1,<2.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routers"]
